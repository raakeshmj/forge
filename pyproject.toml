[project]
name = "forge"
version = "0.0.0"
description = "FORGE: autonomous agent operations and continuous-learning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplifications
    "RUF",           # ruff-specific
    "BLE",           # no blind `except Exception` (CLAUDE.md §24)
    "T20",           # no print; use logging
    "PT",            # pytest style
    "ASYNC",         # async pitfalls
    "S",             # security (bandit)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: requires running PostgreSQL and Redis (see `make test-integration`)",
]
filterwarnings = ["error"]

# Architectural boundaries (CLAUDE.md §5, docs/decisions/0001). Run with `make boundaries`.
[tool.importlinter]
root_package = "forge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on no framework, driver, or adapter"
type = "forbidden"
source_modules = ["forge.domain"]
forbidden_modules = [
    "forge.api",
    "forge.infrastructure",
    "fastapi",
    "starlette",
    "uvicorn",
    "sqlalchemy",
    "psycopg",
    "redis",
]

[[tool.importlinter.contracts]]
name = "Infrastructure adapters do not depend on the HTTP API"
type = "forbidden"
source_modules = ["forge.infrastructure"]
forbidden_modules = ["forge.api", "fastapi", "starlette"]
