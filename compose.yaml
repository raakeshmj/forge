# Local development stack. Credentials here are development defaults only.
# Host ports bind to loopback and are overridable to avoid clashing with other local stacks.
name: forge

x-forge-env: &forge-env
  FORGE_DATABASE_URL: postgresql+psycopg://forge:${FORGE_POSTGRES_PASSWORD:-forge}@postgres:5432/forge
  FORGE_REDIS_URL: redis://redis:6379/0
  FORGE_LOG_LEVEL: ${FORGE_LOG_LEVEL:-INFO}

# postgres (default) or temporal; temporal needs `--profile temporal` (ADR 0011).
x-backend-env: &backend-env
  FORGE_EXECUTION_BACKEND: ${FORGE_EXECUTION_BACKEND:-postgres}
  FORGE_TEMPORAL_ADDRESS: temporal:7233

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${FORGE_POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:${FORGE_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # Persistence disabled: Redis never holds authoritative state (ARCHITECTURE.md §20).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${FORGE_REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: forge:dev
    command: ["alembic", "upgrade", "head"]
    environment: *forge-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: forge:dev
    restart: unless-stopped
    environment:
      <<: [*forge-env, *backend-env]
      # name:token pairs of the humans who approve, write policy, and promote (ADR 0010).
      # Empty by default: no one can, until an operator is configured.
      FORGE_OPERATOR_TOKENS: ${FORGE_OPERATOR_TOKENS:-}
    ports:
      - "127.0.0.1:${FORGE_API_HOST_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    image: forge:dev
    command: ["python", "-m", "forge.runtime"]
    # Any number of replicas may run (`--scale worker=3`); a crashed one is restarted.
    restart: unless-stopped
    environment:
      <<: *backend-env
      FORGE_DATABASE_URL: postgresql+psycopg://forge:${FORGE_POSTGRES_PASSWORD:-forge}@postgres:5432/forge
      FORGE_LOG_LEVEL: ${FORGE_LOG_LEVEL:-INFO}
      FORGE_WORKER_LEASE_SECONDS: ${FORGE_WORKER_LEASE_SECONDS:-30}
      FORGE_WORKER_CONCURRENCY: ${FORGE_WORKER_CONCURRENCY:-4}
      # Simulated tool latency, used by the end-to-end interruption demo to kill mid-step.
      FORGE_DEMO_TOOL_DELAY_SECONDS: ${FORGE_DEMO_TOOL_DELAY_SECONDS:-0}
      FORGE_APPROVAL_TTL_SECONDS: ${FORGE_APPROVAL_TTL_SECONDS:-86400}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
        required: false  # only with `--profile temporal`
    stop_grace_period: 10s

  temporal:
    # Temporal's single-binary dev server, persisted to a volume. Production runs a real
    # Temporal cluster; FORGE only needs its address (ADR 0011).
    image: temporalio/temporal:1.4.1
    profiles: ["temporal"]
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
      - --log-level=warn
    volumes:
      - temporal-data:/home/temporal
    ports:
      - "127.0.0.1:${FORGE_TEMPORAL_HOST_PORT:-17233}:7233"
      - "127.0.0.1:${FORGE_TEMPORAL_UI_HOST_PORT:-18233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  temporal-data:
